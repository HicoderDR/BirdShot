<body>
  <header>
    <span class="brand">BIRDSHOT</span><h1>优选鸟体</h1>
    <div class="header-tools"><span id="status" class="status">读取索引中</span><button id="refresh" type="button">刷新</button></div>
  </header>
  <main>
    <div class="progress-row"><span id="progress-label">等待本地验鸟索引</span><progress id="progress" max="1" value="0" aria-label="本地验鸟候选进度"></progress><span id="updated"></span><span id="counts"></span></div>
    <p id="change-counts"></p>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="shoot-filter">
      <label class="field shoot-field">地点 / 拍摄日期<select id="shoot-group" aria-describedby="shoot-group-status" disabled><option value="">全部拍摄组</option></select></label>
      <p id="shoot-group-status" role="status">地点 / 日期目录尚未准备，仍可浏览全部裁剪。</p>
    </div>
    <div class="toolbar" aria-label="图墙筛选与排序">
      <div class="tabs" role="tablist" aria-label="候选池">
        <button id="preferred-tab" type="button" role="tab" aria-selected="true" aria-controls="gallery">优选鸟体</button>
        <button id="review-tab" type="button" role="tab" aria-selected="false" aria-controls="gallery" tabindex="-1">独立审核</button>
      </div>
      <label class="field">查找鸟种或来源<input id="search" type="search" placeholder="鸟种、文件名、实例" maxlength="160"></label>
      <label class="field">技术等级<select id="tier"><option value="">全部等级</option></select></label>
      <label class="field" id="verification-field" hidden>审核类型<select id="verification"><option value="">全部未入选</option><option value="pending">验鸟未完成</option><option value="unknown">验鸟未知（不含未完成）</option><option value="nonBird">判为非鸟</option><option value="bird">已验鸟但未保留</option></select></label>
      <label class="field">排序<select id="sort"><option value="rank">技术优先</option><option value="reverse">反向浏览</option></select></label>
      <label class="check"><input id="collapse" type="checkbox">每个连拍组仅显示首项</label>
    </div>
    <section id="gallery" class="gallery" role="tabpanel" aria-labelledby="preferred-tab" aria-busy="true"></section>
    <section id="empty" class="empty" hidden><h2 id="empty-title"></h2><p id="empty-message" class="muted"></p></section>
    <nav id="pager" class="pager" aria-label="图墙分页" hidden><button id="previous" type="button">上一页</button><span id="page-label" aria-live="polite"></span><button id="next" type="button">下一页</button><label class="field"><span class="sr-only">每页数量</span><select id="page-size" aria-label="每页数量"><option value="24">24 项 / 页</option><option value="48" selected>48 项 / 页</option><option value="96">96 项 / 页</option></select></label></nav>
    <footer>照片仅从当前本地报告服务读取，原图按需打开。</footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><div class="dialog-heading"><h2 id="dialog-title">鸟体裁剪与组内对比</h2><p id="dialog-source" class="dialog-source"></p></div><button id="close" class="icon-button" type="button" aria-label="关闭" title="关闭详情" autofocus><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="detail" aria-live="polite"></div>
  </dialog>
  <dialog id="photo-viewer" class="photo-viewer" aria-label="照片浏览">
    <div id="photo-stage" class="photo-stage"></div>
    <div class="photo-toolbar"><a id="photo-download" class="primary-action" download hidden>保存原图</a><button id="photo-zoom-out" type="button" aria-label="缩小照片">−</button><button id="photo-zoom-in" type="button" aria-label="放大照片">＋</button><button id="photo-exit" type="button" autofocus>返回详情</button></div>
    <div class="photo-message"><p id="photo-status" role="status" aria-live="polite"></p><button id="photo-retry" type="button" hidden>重试清晰预览</button></div>
    <p class="photo-hint">捏合缩放 · 单击返回 · 长按保存当前图，原文件用“保存原图”</p>
  </dialog>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = String(text);
      return node;
    };
    const state = { index: null, shootGroups: new Map(), pool: 'preferred', page: 1, timer: null, request: null, detailRequest: null, referenceRequest: null, active: null, preview: null, photo: null, ignorePreviewClickUntil: 0 };
    // Same six candidate points as CullingApp.tsx; these are not visibility labels or a skeleton.
    const poseLabels = ['喙', '左眼', '右眼', '头顶', '左肩部', '右肩部'];
    const number = value => typeof value === 'number' && Number.isFinite(value);
    const printable = value => value === undefined || value === null || value === '' ? '未提供' : String(value);
    const format = value => number(value) ? value.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : '未判定';
    const percent = value => number(value) && value >= 0 && value <= 1 ? (value * 100).toFixed(1) + '%' : '未判定';
    const isPreferred = item => item.decision === 'keep' && item.birdVerification?.status === 'bird';

      area.append(wrap, tools);
      visual.append(area, status, retry);
      load('crop', { url: media(metadata.item?.crop || bird.crop), edge: 0 });
    }
    function focusCandidate(frame, bird) {
      state.preview?.cancel();
      state.referenceRequest?.abort();
      const references = new AbortController(); state.referenceRequest = references;
      const metadata = candidateMetadata(frame, bird);
      const panel = $('focus-panel');
      panel.replaceChildren();
      for (const card of $('candidates')?.querySelectorAll('[data-candidate-id]') || []) card.classList.toggle('focused', card.dataset.candidateId === frame.id + ':' + bird.id);
      $('dialog-title').textContent = speciesLabel(metadata.species) + ' · 实例 ' + bird.id;
      $('dialog-source').textContent = frame.source?.primary?.relative || frame.id;
      const layout = el('div', 'detail-layout'), visual = el('section');
      createPreview(frame, bird, metadata, visual);
      const copy = el('section', 'details-copy'), badges = el('div', 'badges');
      badges.append(el('span', badgeClass(metadata.birdVerification?.status), verificationLabel(metadata.birdVerification)), el('span', 'badge review', metadata.decision === 'keep' && metadata.birdVerification?.status === 'bird' ? '优选' : '未入选'));
      copy.append(badges, speciesDetails(metadata.species, false, references.signal));
      copy.append(captureDetails(metadata.capture, false, metadata.shootGroup));
      const technical = el('details', 'technical-details');
      technical.append(el('summary', '', '技术选片依据'), el('p', 'reason', metadata.reason), metrics(bird, metadata.quality), el('p', 'muted', '像素与梯度不等于绝对合焦；仅在可比对象内使用相对指标。'));
      if (bird.maskIssue || bird.poseIssue || bird.eyeIssue) technical.append(el('p', 'muted', [bird.maskIssue, bird.poseIssue, bird.eyeIssue].filter(Boolean).join(' · ')));
      copy.append(technical);
      layout.append(visual, copy); panel.append(layout);
    }
    function renderGroup(group, item) {
      if (!group || !Array.isArray(group.frames)) throw new Error('新版组详情缺少 frames');
      const frame = group.frames.find(candidate => candidate.id === item.frameId);
      const bird = frame?.instances?.find(candidate => String(candidate.id) === String(item.instanceId));
      if (!bird) throw new Error('新版组详情找不到该索引的精确帧 / 实例，未以其他鸟体替代');
      const panel = el('section'); panel.id = 'focus-panel';
      const candidates = el('section', 'candidate-section'); candidates.id = 'candidates';
      candidates.append(el('h3', '', '鸟体对比'), el('p', 'muted', '浏览同图或同组的鸟体候选；不同鸟体不能直接作为同鸟清晰度比较。'));
      const grid = el('div', 'candidate-list');
      let instanceCount = 0;
      for (const candidateFrame of group.frames) {
        if (!Array.isArray(candidateFrame.instances)) throw new Error('新版组详情的实例列表无效');
        if (!candidateFrame.instances.length) {
          const empty = el('div', 'frame-empty');
          empty.append(el('h3', '', candidateFrame.source?.primary?.relative || candidateFrame.id), el('p', 'muted', '未检出鸟体，无鸟体裁剪；不以背景代替。'));
          if (candidateFrame.reason) empty.append(el('p', 'reason', candidateFrame.reason));
          grid.append(empty);
        }
        for (const candidateBird of candidateFrame.instances) {
          instanceCount++;
          const metadata = candidateMetadata(candidateFrame, candidateBird), card = el('article', 'candidate'), button = el('button');
          card.dataset.candidateId = candidateFrame.id + ':' + candidateBird.id; button.type = 'button';
          if (candidateBird.thumbnail || metadata.item?.thumbnail) button.append(imageBox(metadata.item?.thumbnail || candidateBird.thumbnail, '组内裁剪 · 实例 ' + candidateBird.id));
          else button.append(el('p', 'image-error', '此实例没有缩略图'));
          button.append(el('h3', '', (candidateFrame.source?.primary?.relative || candidateFrame.id) + ' · 实例 ' + candidateBird.id));
          button.setAttribute('aria-label', '查看组内实例 ' + candidateBird.id + ' · ' + (candidateFrame.source?.primary?.relative || candidateFrame.id));
          button.addEventListener('click', () => {
            try { focusCandidate(candidateFrame, candidateBird); $('focus-panel').scrollIntoView({ block: 'start', behavior: 'instant' }); }
            catch (error) { $('focus-panel').replaceChildren(el('p', 'notice error', error.message)); }
          });
          card.append(button, el('span', badgeClass(metadata.birdVerification?.status), verificationLabel(metadata.birdVerification)), el('span', 'badge review', qualityLabel(metadata.quality)));
          grid.append(card);
        }
      }
      candidates.append(grid);
      $('detail').replaceChildren(...(instanceCount > 1 ? [panel, candidates] : [panel]));
      focusCandidate(frame, bird);
    }
    async function openDetail(item) {
      if (state.detailRequest) state.detailRequest.abort();
      const controller = new AbortController(); state.detailRequest = controller;
      state.active = item;
      state.preview?.cancel(); closePhoto(); state.preview = null;
      state.referenceRequest?.abort();
      $('dialog-title').textContent = speciesLabel(item.species) + ' · 实例 ' + item.instanceId;
      $('dialog-source').textContent = item.sourceLabel;
      $('detail').replaceChildren(el('p', 'muted', '正在读取新版组详情…'));
      if (!$('dialog').open) $('dialog').showModal();
      try {
        const group = await json(groupUrl(item.groupId), controller.signal);
        if (controller.signal.aborted) return;
        renderGroup(group, item);
      } catch (error) {
        if (controller.signal.aborted) return;
        const message = el('div', 'notice error');
        message.setAttribute('role', 'alert');
        message.append(el('p', '', error.message), el('p', '', '未回退旧版分类或选择结果。'));
        const retry = el('button', '', '重试组详情'); retry.type = 'button'; retry.addEventListener('click', () => openDetail(item));
        $('detail').replaceChildren(message, retry);
      }
    }
    $('preferred-tab').addEventListener('click', () => switchPool('preferred'));
    $('review-tab').addEventListener('click', () => switchPool('review'));
    for (const id of ['preferred-tab', 'review-tab']) $(id).addEventListener('keydown', event => {
      if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
        event.preventDefault();
        switchPool(event.key === 'Home' ? 'preferred' : event.key === 'End' ? 'review' : state.pool === 'preferred' ? 'review' : 'preferred', true);
      }
    });
    for (const id of ['shoot-group', 'search', 'tier', 'verification', 'sort', 'collapse', 'page-size']) $(id).addEventListener(id === 'search' ? 'input' : 'change', () => { state.page = 1; render(); });
    function changePage(delta) { state.page += delta; render(); $('gallery').scrollIntoView({ block: 'start' }); }
    $('previous').addEventListener('click', () => changePage(-1));
    $('next').addEventListener('click', () => changePage(1));
    $('refresh').addEventListener('click', refresh);
    $('close').addEventListener('click', () => $('dialog').close());
    $('dialog').addEventListener('close', () => {
      if ($('dialog').open) return;
      if (state.detailRequest) state.detailRequest.abort();
      state.referenceRequest?.abort();
      state.preview?.cancel(); closePhoto(); $('detail').replaceChildren(); state.preview = null; state.active = null;
    });
    for (const name of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']) $('photo-stage').addEventListener(name, name === 'pointerdown' ? photoPointerDown : name === 'pointermove' ? photoPointerMove : photoPointerEnd);
    $('photo-stage').addEventListener('contextmenu', () => { if (state.photo) state.photo.suppressTapUntil = performance.now() + 1000; });
    $('photo-exit').addEventListener('click', closePhoto);
    $('photo-retry').addEventListener('click', () => state.photo?.preview.retry());
    for (const [id, delta] of [['photo-zoom-in', .5], ['photo-zoom-out', -.5]]) {
      const button = $(id);
      let touchStart, touchActivated = -Infinity;
      const activate = () => { if (state.photo) { state.photo.scale += delta; transformPhoto(); state.photo.preview.schedule(); } };
      button.addEventListener('pointerdown', event => { touchStart = { x: event.clientX, y: event.clientY, at: performance.now() }; });
      button.addEventListener('pointerup', event => {
        if (event.pointerType === 'touch' && touchStart && performance.now() - touchStart.at < 350 && Math.hypot(event.clientX - touchStart.x, event.clientY - touchStart.y) < 8) {
          touchActivated = performance.now(); activate();
        }
        touchStart = null;
      });
      button.addEventListener('click', event => { if (event.detail === 0 || performance.now() - touchActivated > 600) activate(); });
    }
    $('photo-viewer').addEventListener('close', () => {
      const photo = state.photo;
      if (photo) {
        photo.preview.cancel();
        photo.image.style.transform = '';
        if (photo.preview.wrap.isConnected) photo.preview.wrap.insertBefore(photo.image, photo.preview.svg);
        sizePreviewImage(photo.preview, photo.image, photo.preview.mode);
        $('dialog').scrollTop = photo.scroll;
      }
      state.photo = null; state.ignorePreviewClickUntil = performance.now() + 400;
      $('photo-stage').replaceChildren();
    });
    window.addEventListener('resize', () => { state.preview?.resize(); transformPhoto(); });
    window.addEventListener('pagehide', () => { clearTimeout(state.timer); state.request?.abort(); state.detailRequest?.abort(); state.referenceRequest?.abort(); });
    refresh();
  </script>
</body>
</html>
